<!DOCTYPE html>
<html>

<head>
    <title>Linda's Lights 💡</title>
</head>

<body>

    <h1>Toggle lights 💡</h1>
    <p>Switch the following lights on and off:</p>

    <form>
        <input type="checkbox" id="ledBlue" onchange="toggleLight('livingroom')">
        <label for="ledBlue">Living room (blue)</label><br>

        <input type="checkbox" id="ledYellow" onchange="toggleLight('bathroom')">
        <label for="ledYellow">Bathroom (yellow)</label><br>

        <input type="checkbox" id="ledRed" onchange="toggleLight('closet')">
        <label for="ledRed">Closet (red)</label>
    </form>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>     <!-- RESUB: Imports MQTT.js library for browser MQTT communication -->

    <script>
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');  // RESUB: Connects to MQTT broker using WebSockets

        client.on('connect', () => {
            console.log('Connected to MQTT broker');
        });

        function toggleLight(room) {
            client.publish('lindas_lights', room);
            console.log(`Sent: ${room}`);
        }
    </script>

</body>

</html>
